# ==========================================================
# AeroSpace Config - Emoji & Numbers Workspaces (Fixed)
# ==========================================================

start-at-login = true
default-root-container-orientation = 'auto'

# Mouse follow logic
on-focus-changed =['move-mouse window-lazy-center']
on-focused-monitor-changed =['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        10
outer.right =      10

[workspace-to-monitor-force-assignment]
# --- GRUPPO PRODUZIONE (1-4) ---
'1-Web-🌐'  = ['DELL.*1', 'DELL']
'2-Code-💻' = ['DELL.*1', 'DELL']
'3-AI-🤖'   = ['DELL.*1', 'DELL']
'4-Misc-🗂️' = ['DELL.*2', 'built-in']
'5-Teams-👥'   = ['DELL.*2', 'built-in']
'6-Chat-💬'    = ['DELL.*2', 'built-in']
'7-Spotify-🎵' = ['DELL.*2', 'built-in']
'8-Mail-📧'    = ['DELL.*2', 'built-in']

