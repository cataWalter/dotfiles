# ==========================================================
# KEYBINDINGS
# ==========================================================
[mode.main.binding]

# --- Lancia App Rapide ---
cmd-alt-enter = 'exec-and-forget open -a Terminal'
cmd-alt-b     = 'exec-and-forget open -a "Google Chrome"'
cmd-alt-c     = 'exec-and-forget open -a "Visual Studio Code"'
cmd-alt-t     = 'exec-and-forget open -a "Microsoft Teams"'
cmd-alt-e     = 'exec-and-forget open -a "Microsoft Outlook"'
cmd-alt-s     = 'exec-and-forget open -a "Spotify"'
cmd-alt-g     = 'exec-and-forget open -a "Gemini"'

# --- Navigazione tra Monitor ---
cmd-alt-f = 'fullscreen'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Vai al Workspace ---
ctrl-1 = 'workspace 1-Web-🌐'
ctrl-2 = 'workspace 2-Code-💻'
ctrl-3 = 'workspace 3-AI-🤖'
ctrl-4 = 'workspace 4-Misc-🗂️'
ctrl-5 = 'workspace 5-Teams-👥'
ctrl-6 = 'workspace 6-Chat-💬'
ctrl-7 = 'workspace 7-Spotify-🎵'
ctrl-8 = 'workspace 8-Mail-📧'

# --- Sposta la Finestra Attiva nel Workspace ---
ctrl-shift-1 = 'move-node-to-workspace --focus-follows-window 1-Web-🌐'
ctrl-shift-2 = 'move-node-to-workspace --focus-follows-window 2-Code-💻'
ctrl-shift-3 = 'move-node-to-workspace --focus-follows-window 3-AI-🤖'
ctrl-shift-4 = 'move-node-to-workspace --focus-follows-window 4-Misc-🗂️'
ctrl-shift-5 = 'move-node-to-workspace --focus-follows-window 5-Teams-👥'
ctrl-shift-6 = 'move-node-to-workspace --focus-follows-window 6-Chat-💬'
ctrl-shift-7 = 'move-node-to-workspace --focus-follows-window 7-Spotify-🎵'
ctrl-shift-8 = 'move-node-to-workspace --focus-follows-window 8-Mail-📧'