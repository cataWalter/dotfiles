add_newline = false

format = """$directory$git_branch$git_status$all$line_break$character"""
right_format = """$cmd_duration"""

[directory]
style = "bold cyan"
truncation_length = 3
fish_style_pwd_dir_length = 1
read_only = " 🔒" # Emoji standard

[git_branch]
symbol = "🌿 " # Emoji standard
style = "purple"

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 500
format = "[⏱ $duration]($style)" # Emoji standard
style = "yellow italic"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✘](bold red)"
vicmd_symbol = "[❮](bold yellow)"